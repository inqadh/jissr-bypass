name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...

  android:
    name: Android AAR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"
      - name: Build AAR
        run: |
          mkdir -p dist/android
          go tool gomobile init
          go tool gomobile bind \
            -target=android \
            -androidapi 26 \
            -o dist/android/jissr-bypass.aar \
            ./mobile
      - name: Test and build OkHttp adapter
        run: |
          gradle \
            --no-daemon \
            -p adapters/okhttp \
            "-PjissrBypassAar=$GITHUB_WORKSPACE/dist/android/jissr-bypass.aar" \
            :library:testDebugUnitTest \
            :library:assembleRelease \
            :library:sourceReleaseJar
          sources_jar="$(
            find adapters/okhttp/library/build \
              -type f -name '*sources*.jar' -print -quit
          )"
          test -n "$sources_jar"
          cp "$sources_jar" dist/android/jissr-bypass-okhttp-sources.jar
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/android/jissr-bypass.aar
            dist/android/jissr-bypass-sources.jar
            dist/android/jissr-bypass-okhttp-sources.jar
            adapters/okhttp/library/build/outputs/aar/library-release.aar
          if-no-files-found: error

  apple:
    name: Apple XCFramework
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build XCFramework
        run: bash scripts/build-apple.sh
      - name: Test URLSession adapter
        run: |
          mkdir -p adapters/apple/Binaries
          cp -R \
            dist/apple/JissrBypass.xcframework \
            adapters/apple/Binaries/JissrBypass.xcframework
          swift test --package-path adapters/apple
      - name: Package XCFramework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/apple/JissrBypass.xcframework \
            dist/apple/JissrBypass.xcframework.zip
      - uses: actions/upload-artifact@v7
        with:
          name: apple
          path: dist/apple/JissrBypass.xcframework.zip
          if-no-files-found: error

  desktop:
    name: Desktop executables
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build desktop matrix
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop
          path: dist/desktop/*
          if-no-files-found: error

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: jissr-bypass-sbom.spdx.json
          artifact-name: sbom
          upload-release-assets: false

  publish:
    name: Publish GitHub release
    needs:
      - verify
      - android
      - apple
      - desktop
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
      - name: Create checksums
        working-directory: release-assets
        run: |
          find . -type f -print0 |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/**/*
