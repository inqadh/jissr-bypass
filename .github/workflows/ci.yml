name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...

  android:
    name: Android AAR and Maven bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"
      - name: Build AAR
        run: |
          mkdir -p dist/android
          go tool gomobile init
          go tool gomobile bind \
            -target=android \
            -androidapi 26 \
            -o dist/android/jissr-bypass.aar \
            ./mobile
      - name: Test and build OkHttp adapter
        run: |
          gradle \
            --no-daemon \
            -p adapters/okhttp \
            "-PjissrBypassAar=$GITHUB_WORKSPACE/dist/android/jissr-bypass.aar" \
            :library:testDebugUnitTest \
            :library:assembleRelease \
            :library:sourceReleaseJar
          sources_jar="$(
            find adapters/okhttp/library/build \
              -type f -name '*sources*.jar' -print -quit
          )"
          test -n "$sources_jar"
          cp "$sources_jar" dist/android/jissr-bypass-okhttp-sources.jar
      - name: Validate Maven Central bundle
        run: |
          gpg --batch --passphrase '' --quick-generate-key \
            'Jissr Bypass CI <ci@example.invalid>' rsa2048 sign 1d
          export MAVEN_SIGNING_KEY_B64
          MAVEN_SIGNING_KEY_B64="$(
            gpg --batch --armor --export-secret-keys | base64 -w0
          )"
          bash scripts/build-maven-central.sh \
            0.0.0-ci \
            dist/android/jissr-bypass.aar \
            dist/android/jissr-bypass-sources.jar \
            dist/maven-central/central-bundle.zip \
            adapters/okhttp/library/build/outputs/aar/library-release.aar \
            dist/android/jissr-bypass-okhttp-sources.jar
          unzip -q dist/maven-central/central-bundle.zip \
            -d dist/maven-central/verify
          release_dir=dist/maven-central/verify/org/jissr/jissr-bypass-android/0.0.0-ci
          test -f "$release_dir/jissr-bypass-android-0.0.0-ci.aar"
          test -f "$release_dir/jissr-bypass-android-0.0.0-ci-sources.jar"
          test -f "$release_dir/jissr-bypass-android-0.0.0-ci-javadoc.jar"
          test -f "$release_dir/jissr-bypass-android-0.0.0-ci.pom"
          okhttp_dir=dist/maven-central/verify/org/jissr/jissr-bypass-okhttp/0.0.0-ci
          test -f "$okhttp_dir/jissr-bypass-okhttp-0.0.0-ci.aar"
          test -f "$okhttp_dir/jissr-bypass-okhttp-0.0.0-ci-sources.jar"
          test -f "$okhttp_dir/jissr-bypass-okhttp-0.0.0-ci-javadoc.jar"
          test -f "$okhttp_dir/jissr-bypass-okhttp-0.0.0-ci.pom"
          grep -q '<artifactId>jissr-bypass-android</artifactId>' \
            "$okhttp_dir/jissr-bypass-okhttp-0.0.0-ci.pom"
          grep -q '<artifactId>okhttp</artifactId>' \
            "$okhttp_dir/jissr-bypass-okhttp-0.0.0-ci.pom"
          unzip -q \
            "$release_dir/jissr-bypass-android-0.0.0-ci-javadoc.jar" \
            -d dist/maven-central/javadoc
          test -f dist/maven-central/javadoc/index.html
          test -f dist/maven-central/javadoc/jissrbypass/Client.html
          grep -q '<organization>' \
            "$release_dir/jissr-bypass-android-0.0.0-ci.pom"
          grep -q '<issueManagement>' \
            "$release_dir/jissr-bypass-android-0.0.0-ci.pom"
          for artifact in \
            "$release_dir"/*.aar \
            "$release_dir"/*.jar \
            "$release_dir"/*.pom \
            "$okhttp_dir"/*.aar \
            "$okhttp_dir"/*.jar \
            "$okhttp_dir"/*.pom; do
            gpg --batch --verify "$artifact.asc" "$artifact"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: jissr-bypass-android
          path: |
            dist/android/jissr-bypass.aar
            dist/android/jissr-bypass-sources.jar
            dist/android/jissr-bypass-okhttp-sources.jar
            adapters/okhttp/library/build/outputs/aar/library-release.aar
          if-no-files-found: error

  android-consumer:
    name: Android Maven consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"
      - name: Build clean Maven Central consumer
        working-directory: examples/android
        # Main may document the next immutable version before Central has
        # replicated it. Keep this job pinned to the latest already-published
        # stable package; the release checklist verifies the new coordinate.
        run: >
          gradle --no-daemon
          -PjissrBypassVersion=0.1.0
          :app:assembleDebug

  apple:
    name: Apple XCFramework
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build XCFramework
        run: bash scripts/build-apple.sh
      - name: Test URLSession adapter
        run: |
          mkdir -p adapters/apple/Binaries
          cp -R \
            dist/apple/JissrBypass.xcframework \
            adapters/apple/Binaries/JissrBypass.xcframework
          swift test --package-path adapters/apple
      - name: Package XCFramework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/apple/JissrBypass.xcframework \
            dist/apple/JissrBypass.xcframework.zip
      - uses: actions/upload-artifact@v6
        with:
          name: jissr-bypass-apple
          path: dist/apple/JissrBypass.xcframework.zip
          if-no-files-found: error

  desktop:
    name: Desktop executables
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build desktop matrix
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Version "ci-${{ github.sha }}"
      - uses: actions/upload-artifact@v6
        with:
          name: jissr-bypass-desktop
          path: dist/desktop/*
          if-no-files-found: error
